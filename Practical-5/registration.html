    <section>
        <h2>Student Registration Form</h2>

        <!-- novalidate = we do the checking ourselves in JavaScript -->
        <form id="regForm" novalidate>

            <label for="name"><b>Full Name:</b></label><br>
            <input type="text" id="name" name="name"
            placeholder="Enter your full name"><br>
            <span class="error" id="nameError"></span><br>

            <label for="enrollment"><b>Enrollment Number:</b></label><br>
            <input type="text" id="enrollment" name="enrollment"
            placeholder="Enter enrollment number (e.g. 26IT001)"><br>
            <span class="error" id="enrollmentError"></span><br>

            <label for="email"><b>Email Address:</b></label><br>
            <input type="email" id="email" name="email"
            placeholder="Enter your email"><br>
            <span class="error" id="emailError"></span><br>

            <label for="mobile"><b>Mobile Number:</b></label><br>
            <input type="tel" id="mobile" name="mobile"
            placeholder="Enter 10 digit mobile number"><br>
            <span class="error" id="mobileError"></span><br>

            <label><b>Gender:</b></label><br>

            <input type="radio" id="male" name="gender" value="Male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label>

            <br>
            <span class="error" id="genderError"></span><br>

            <label for="semester"><b>Semester:</b></label><br>

            <select id="semester" name="semester">
                <option value="">Select Semester</option>
                <option>Semester 1</option>
                <option>Semester 2</option>
                <option>Semester 3</option>
                <option>Semester 4</option>
                <option>Semester 5</option>
                <option>Semester 6</option>
                <option>Semester 7</option>
                <option>Semester 8</option>
            </select>

            <br>
            <span class="error" id="semesterError"></span><br>

            <label for="course"><b>Course:</b></label><br>

            <select id="course" name="course">
                <option value="">Select Course</option>
                <option>BCA</option>
                <option>B.Tech</option>
                <option>B.Sc</option>
                <option>B.Com</option>
                <option>MCA</option>
            </select>

            <br>
            <span class="error" id="courseError"></span><br>

            <label for="address"><b>Address:</b></label><br>

            <textarea id="address"
            rows="4"
            cols="40"
            placeholder="Enter your address"></textarea>
            <br><span id="charCount">0 characters</span><br>
            <span class="error" id="addressError"></span><br>

            <label for="password"><b>Password:</b></label><br>

            <input type="password"
            id="password"
            name="password"
            placeholder="Create password">

            <br>
            <span class="error" id="passwordError"></span><br>

            <label for="confirm"><b>Confirm Password:</b></label><br>

            <input type="password"
            id="confirm"
            name="confirm"
            placeholder="Confirm password">

            <br>
            <span class="error" id="confirmError"></span><br>

            <input type="submit" value="Register">

            <input type="reset" value="Clear">

            <p id="successMsg"></p>

        </form>

    </section>

<script src="script.js"></script>
</body>
