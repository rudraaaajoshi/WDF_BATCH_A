    <!-- Registration Form -->
    <section>
        <h2>Student Registration Form</h2>

        <form>

            <label for="name"><b>Full Name:</b></label><br>
            <input type="text" id="name" name="name"
            placeholder="Enter your full name" required><br><br>

            <label for="enrollment"><b>Enrollment Number:</b></label><br>
            <input type="text" id="enrollment" name="enrollment"
            placeholder="Enter enrollment number" required><br><br>

            <label for="email"><b>Email Address:</b></label><br>
            <input type="email" id="email" name="email"
            placeholder="Enter your email" required><br><br>

            <label for="mobile"><b>Mobile Number:</b></label><br>
            <input type="tel" id="mobile" name="mobile"
            placeholder="Enter mobile number" required><br><br>

            <label><b>Gender:</b></label><br>

            <input type="radio" id="male" name="gender">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender">
            <label for="other">Other</label>

            <br><br>

            <label for="semester"><b>Semester:</b></label><br>

            <select id="semester" name="semester">
                <option>Select Semester</option>
                <option>Semester 1</option>
                <option>Semester 2</option>
                <option>Semester 3</option>
                <option>Semester 4</option>
                <option>Semester 5</option>
                <option>Semester 6</option>
                <option>Semester 7</option>
                <option>Semester 8</option>
            </select>

            <br><br>

            <label for="course"><b>Course:</b></label><br>

            <select id="course" name="course">
                <option>Select Course</option>
                <option>BCA</option>
                <option>B.Tech</option>
                <option>B.Sc</option>
                <option>B.Com</option>
                <option>MCA</option>
            </select>

            <br><br>

            <label for="address"><b>Address:</b></label><br>

            <textarea id="address"
            rows="4"
            cols="40"
            placeholder="Enter your address"></textarea>

            <br><br>

            <label for="password"><b>Password:</b></label><br>

            <input type="password"
            id="password"
            name="password"
            placeholder="Create password"
            required>

            <br><br>

            <label for="confirm"><b>Confirm Password:</b></label><br>

            <input type="password"
            id="confirm"
            name="confirm"
            placeholder="Confirm password"
            required>

            <br><br>

            <input type="submit" value="Register">

            <input type="reset" value="Clear">

        </form>

    </section>
